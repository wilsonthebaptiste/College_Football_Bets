name = "cfb-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

# ─── Public configuration ────────────────────────────────────────────────────
# Non-secret values live here so they are reviewable in git.
[vars]
# "espn" | "mock". "mock" is a generated, deterministic season that needs no
# network: it keeps local development and CI off ESPN. Switch to "espn" for
# real data (override locally with `--var SPORTS_PROVIDER:espn`).
SPORTS_PROVIDER = "mock"

# Optional User-Agent for ESPN requests. Unset uses the descriptive default in
# src/providers/espn/client.ts. ESPN's CDN answers 403 to that default, both from
# local workerd and from the deployed Worker (docs/espn-notes.md §1), so ESPN
# mode under `wrangler dev` needs an override, e.g.
# `--var ESPN_USER_AGENT:"curl/8.9.1 college-football-bets/0.5"`. Production
# sets it in [env.production.vars] below.
# ESPN_USER_AGENT = ""

# Development and test only: make chosen provider calls fail, to see stale and
# unavailable states. Comma-separated: all, schedule, rankings, slate, game,
# prediction, calendar, teams, team:<providerTeamId>. Never set in production.
# SPORTS_PROVIDER_FAULT = ""

# Comma-separated CORS allowlist. "*" is accepted for local development only.
# The deployed Worker overrides this with the Pages origin: see [env.production]
# below and docs/ops.md, "Deploying".
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"

# Public reads allowed per client address per minute, per isolate (plan §5.3).
# Unset means 120; "off" disables it. See src/middleware/rate-limit.ts.
# READ_RATE_LIMIT_PER_MINUTE = "120"

LOG_LEVEL = "info"

# Optional season pin, e.g. "2025:regular:5". Leave unset in normal operation —
# the season resolves from the provider calendar, then the date heuristic (§21).
# SEASON_OVERRIDE = ""

# ─── Secrets ─────────────────────────────────────────────────────────────────
# NOT set here. Locally they come from apps/api/.dev.vars (gitignored);
# in production from `wrangler secret put`:
#
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_ANON_KEY
#
# There is deliberately no SUPABASE_SERVICE_ROLE_KEY. See src/db/client.ts.

# ─── Workers KV (cache tier L3) ──────────────────────────────────────────────
# Create with:  wrangler kv namespace create SPORTS_KV
#               wrangler kv namespace create SPORTS_KV --preview
# then paste the ids below. It holds the Supabase JWKS and the durable copy of
# sports data. Writes are budgeted in src/cache/tiers.ts, and /api/health reports them.
[[kv_namespaces]]
binding = "SPORTS_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_ID"

[observability]
enabled = true

# ─── Cron warmers (plan §5.4, src/cron/warm.ts) ──────────────────────────────
# Every 10 minutes on autumn weekends (Fri–Sun UTC, August–January), hourly
# otherwise. They refresh the season calendar, rankings, team list, and
# conferences into KV, off the request path, and run one Postgres select so the
# free Supabase project never pauses. A handful of KV writes a day. The handler
# skips the hourly run when the game-day schedule is also firing.
# `wrangler dev --test-scheduled` exposes /__scheduled to run one by hand.
[triggers]
crons = ["*/10 * * 8-12,1 FRI,SAT,SUN", "0 * * * *"]

# ─── Production (wrangler deploy --env production) ───────────────────────────
# Deployed 2026-09-19 as https://cfb-api.cfb-api.workers.dev, serving the site
# at https://cfb-board-pfc.pages.dev (docs/ops.md, "Deploying").
# Top-level [vars] and bindings are NOT inherited by an environment, so every
# one is restated here. Secrets are per environment too:
#   wrangler secret put SUPABASE_URL --env production
#   wrangler secret put SUPABASE_ANON_KEY --env production
[env.production]
name = "cfb-api"
workers_dev = true

[env.production.vars]
SPORTS_PROVIDER = "espn"
# The deployed Pages origin. Nothing else.
ALLOWED_ORIGINS = "https://cfb-board-pfc.pages.dev"
LOG_LEVEL = "info"
# The owner's decision (plan Phase 2 follow-up; docs/ops.md, "The ESPN
# User-Agent"). Measured on the first deploy: ESPN answers 403 to the default
# from Cloudflare's network, as it did from local workerd, and accepts a value
# with a common HTTP-library prefix.
ESPN_USER_AGENT = "curl/8.9.1 college-football-bets/0.5"

[[env.production.kv_namespaces]]
binding = "SPORTS_KV"
id = "5777a3ec40164cc283c45de25f685ed3"

[env.production.triggers]
crons = ["*/10 * * 8-12,1 FRI,SAT,SUN", "0 * * * *"]

[env.production.observability]
enabled = true
