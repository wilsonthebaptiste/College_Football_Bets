name = "cfb-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

# ─── Public configuration ────────────────────────────────────────────────────
# Non-secret values live here so they are reviewable in git.
[vars]
# "espn" | "mock". "mock" is a generated, deterministic season that needs no
# network: it keeps local development and CI off ESPN. Switch to "espn" for
# real data (override locally with `--var SPORTS_PROVIDER:espn`).
SPORTS_PROVIDER = "mock"

# Optional User-Agent for ESPN requests. Unset uses the descriptive default in
# src/providers/espn/client.ts. ESPN's CDN answers 403 to that default from local
# workerd (see docs/espn-notes.md §1), so ESPN mode under `wrangler dev` needs
# an override. Decide what production sends before the first deploy.
# ESPN_USER_AGENT = ""

# Development and test only: make chosen provider calls fail, to see stale and
# unavailable states. Comma-separated: all, schedule, rankings, slate, game,
# prediction, calendar, teams, team:<providerTeamId>. Never set in production.
# SPORTS_PROVIDER_FAULT = ""

# Comma-separated CORS allowlist. "*" is accepted for local development only.
# Phase 5 narrows this to the deployed Pages origin.
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"

LOG_LEVEL = "info"

# Optional season pin, e.g. "2025:regular:5". Leave unset in normal operation —
# the season resolves from the provider calendar, then the date heuristic (§21).
# SEASON_OVERRIDE = ""

# ─── Secrets ─────────────────────────────────────────────────────────────────
# NOT set here. Locally they come from apps/api/.dev.vars (gitignored);
# in production from `wrangler secret put`:
#
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_ANON_KEY
#
# There is deliberately no SUPABASE_SERVICE_ROLE_KEY. See src/db/client.ts.

# ─── Workers KV (cache tier L3) ──────────────────────────────────────────────
# Create with:  wrangler kv namespace create SPORTS_KV
#               wrangler kv namespace create SPORTS_KV --preview
# then paste the ids below. It holds the Supabase JWKS and the durable copy of
# sports data. Writes are budgeted in src/cache/tiers.ts, and /api/health reports them.
[[kv_namespaces]]
binding = "SPORTS_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_ID"

[observability]
enabled = true
